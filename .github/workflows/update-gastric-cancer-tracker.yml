name: Update gastric cancer tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch public evidence and generate candidate report
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python biopharma-intelligence/scripts/update_tracker.py
      - name: Commit changed data and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add biopharma-intelligence/data biopharma-intelligence/weekly-reports/generated biopharma-intelligence/screening/asreview_input.csv
          git diff --cached --quiet || git commit -m "chore: update gastric cancer tracker"
          git push
